name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Read-only by default; jobs that publish ask for more below.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth (setup-go pins
          # GOTOOLCHAIN=local, so an older matrix version cannot build it).
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test (-race)
        run: go test -race -timeout 60s ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build-binaries:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' \
            -o "dist/lumen-bridge-${{ matrix.os }}-${{ matrix.arch }}" \
            ./cmd/lumen-bridge
          (cd dist && tar czf "lumen-bridge-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
            "lumen-bridge-${{ matrix.os }}-${{ matrix.arch }}")
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-bridge-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/lumen-bridge-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          retention-days: 14

  docker:
    name: Docker (multi-arch → ghcr.io)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write   # push the multi-arch image to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lorislabapp/lumen-bridge-linux
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release (tags only)
    needs: [test, build-binaries, docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # softprops/action-gh-release creates the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(ls *.tar.gz | wc -l)" -eq 4
      - name: Release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## / { if (f) exit; if (index($0, "## [" v "]") == 1) f = 1; next } f' CHANGELOG.md > dist/NOTES.md
          test -s dist/NOTES.md || echo "See CHANGELOG.md" > dist/NOTES.md
          cat dist/NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: dist/NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
